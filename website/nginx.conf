limit_req_zone $binary_remote_addr zone=remixtify_api:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
  client_max_body_size 64k;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/openapi.yaml {
    try_files $uri =404;
    default_type application/yaml;
    expires 5m;
  }

  location /api/ {
    limit_req zone=remixtify_api burst=40 nodelay;
    proxy_pass http://api:8080;
    proxy_hide_header X-Content-Type-Options;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location ~* \.(png|webp|ico)$ {
    try_files $uri =404;
    expires 30d;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
