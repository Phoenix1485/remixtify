<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remixify desktop layout regression fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #f4f7fc; background: #081622; font: 14px/1.45 system-ui, sans-serif; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: #ffffff18; border-radius: 8px; }
    .Root__top-container { display: grid; height: 100vh; padding: 12px; gap: 16px; grid-template: 64px 1fr / 72px 1fr 360px; }
    [data-testid="global-nav-bar"] { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .history, .nav-end, .search-section { display: flex; align-items: center; gap: 8px; }
    .history button, .nav-end > button { width: 34px; height: 34px; }
    .search-section { width: 520px; position: relative; }
    .search-section > button { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; }
    .search-field { flex: 1; min-width: 0; position: relative; }
    .searchInputCollapsed input[type="search"] { width: 50px; color: transparent; }
    input[type="search"] { width: 100%; height: 44px; padding: 0 16px; background: #ffffff12; border: 1px solid #ffffff30; border-radius: 22px; }
    #search-results { position: absolute; inset: 52px 0 auto; min-height: 210px; padding: 20px; border-radius: 16px; background: #243445; z-index: 2; }
    #search-results button { display: block; width: 100%; margin: 8px 0; padding: 12px; text-align: left; }
    [hidden] { display: none !important; }
    [data-testid="window-controls"] { display: flex; }
    #Desktop_LeftSidebar_Id { grid-area: left-sidebar; overflow: hidden; }
    #Desktop_LeftSidebar_Id nav { height: 100%; }
    #Desktop_LeftSidebar_Id button { width: 48px; height: 48px; margin: 8px auto; display: block; }
    #main-view { grid-area: main-view; overflow: hidden; }
    .main-view-container__scroll-node { height: 100%; overflow: auto; }
    .contentSpacing { padding: 24px; }
    h2 { font-size: 23px; letter-spacing: -.04em; margin: 0 0 16px; }
    .filters { display: flex; justify-content: center; gap: 8px; margin: 0 0 32px; }
    .filters button { padding: 8px 16px; border-radius: 20px; }
    .shelf-header { display: flex; justify-content: space-between; align-items: center; }
    .shelf-header a { font-size: 12px; color: #bac5d5; }
    [data-testid="component-shelf"] { overflow: hidden; min-width: 0; }
    [data-testid="carousel-scroller"] { overflow: auto; }
    [role="grid"] { display: grid; grid-auto-flow: column; grid-auto-columns: 190px; gap: 16px; margin-inline: calc(var(--shelf-carousel-margin-start-mul, -1) * 24px); }
    [role="row"] { display: flex; }
    .e-10451-card { display: flex; flex-direction: column; gap: 8px; position: relative; background: #333a48; border: 1px solid #ffffff24; }
    .e-10451-card:hover::after { content: ""; position: absolute; inset: 0; background: #1f1f1f; pointer-events: none; z-index: -1; }
    .e-10451-image__container { display: block; position: relative; aspect-ratio: 1; width: 100%; flex-shrink: 0; background: linear-gradient(135deg, hsl(var(--hue) 70% 50%), hsl(calc(var(--hue) + 55) 70% 20%)); }
    .cover-word { display: grid; place-items: center; width: 100%; height: 100%; font-weight: 800; font-size: 28px; text-shadow: 0 2px 10px #0008; }
    .e-10451-card__main, .e-10451-card__column { display: flex; flex-direction: column; min-width: 0; }
    [data-encore-id="cardTitle"] { font-weight: 700; }
    [data-encore-id="cardSubtitle"] { font-size: 13px; color: #7c8390; }
    .Root__now-playing-bar { grid-area: now-playing-bar; }
    [data-testid="now-playing-bar"] { width: 100%; }
    .player-frame { display: flex; }
    [data-testid="now-playing-widget"] { display: grid; grid-template-columns: 1fr auto; align-items: center; }
    [data-testid="context-item-info-title"] { font-size: 24px; font-weight: 800; }
    [data-testid="cover-art-image"] { width: 48px; height: 48px; }
    [data-testid="now-playing-widget"] > :first-child { display: none; }
    [data-testid="player-controls"] { display: flex; flex-direction: column; gap: 16px; }
    [data-testid="general-controls"] { display: flex; gap: 16px; align-items: center; }
    .transport-side { display: flex; flex: 1; gap: 8px; }
    .transport-side:first-child { justify-content: flex-end; }
    [data-testid="general-controls"] button { width: 38px; height: 38px; }
    [data-testid="control-button-playpause"] > span { padding-left: 5px; color: #000; }
    .playback-bar { display: flex; align-items: center; gap: 8px; }
    [data-testid="playback-progressbar"] { flex: 1; }
    input[type="range"] { width: 100%; }
    .aux-controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
    [data-testid="volume-bar"] { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="Root"><div class="Root__top-container">
    <header data-testid="global-nav-bar" class="searchInputCollapsed">
      <div class="history"><button aria-label="Main menu">•••</button><button aria-label="Back">‹</button><button aria-label="Forward">›</button></div>
      <div class="search-section"><button aria-label="Home">⌂</button><form role="search" class="search-field"><div>
        <input type="search" role="combobox" data-testid="search-input" aria-label="Search" aria-controls="search-results" aria-expanded="false" placeholder="What do you want to play?">
        </div><div id="search-results" role="listbox" hidden><strong>Recent searches</strong><button role="option">Daily Mix</button><button role="option">Your favourite artists</button></div>
      </form></div>
      <div class="nav-end"><button aria-label="Notifications">♧</button><button aria-label="Profile">L</button><div data-testid="window-controls"><button aria-label="Minimize">−</button><button aria-label="Maximize">□</button><button aria-label="Close" title="Close window">×</button></div></div>
    </header>
    <aside id="Desktop_LeftSidebar_Id" style="--left-sidebar-width: 72px"><nav><button>S</button><button>▥</button><button>+</button><button>♥</button></nav></aside>
    <main id="main-view"><div class="main-view-container"><div class="main-view-container__scroll-node"><div data-testid="home-page"><div class="contentSpacing">
      <div class="filters"><button>All</button><button>Music</button><button>Podcasts</button><button>Audiobooks</button></div>
      <section data-testid="component-shelf" data-shelf="carousel"><div class="shelf-header" data-testid="rich-title-row-shelf-header"><h2>Made For Len</h2><a href="#">Show all</a></div><div data-testid="carousel-scroller"><div role="grid"></div></div></section>
      <section data-testid="component-shelf" data-shelf="carousel"><div class="shelf-header" data-testid="rich-title-row-shelf-header"><h2>Your top mixes</h2><a href="#">Show all</a></div><div data-testid="carousel-scroller"><div role="grid"></div></div></section>
      <section data-testid="component-shelf" data-shelf="carousel"><div class="shelf-header" data-testid="rich-title-row-shelf-header"><h2>Recents</h2><a href="#">Show all</a></div><div data-testid="carousel-scroller"><div role="grid"></div></div></section>
    </div></div></div></div></main>
    <aside class="Root__now-playing-bar"><footer data-testid="now-playing-bar"><div class="player-frame">
      <div data-testid="now-playing-widget"><div><img data-testid="cover-art-image" alt="Fixture album artwork" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cdefs%3E%3ClinearGradient id='g'%3E%3Cstop stop-color='%236a9ab3'/%3E%3Cstop offset='1' stop-color='%23443978'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='400' fill='url(%23g)'/%3E%3Ccircle cx='200' cy='170' r='95' fill='%23ffffff' fill-opacity='.25'/%3E%3Ctext x='200' y='340' fill='white' font-family='sans-serif' font-size='36' text-anchor='middle'%3ECollab Bro%3C/text%3E%3C/svg%3E"></div><div><div data-testid="context-item-info-title">Collab Bro</div><div data-testid="context-item-info-subtitles">N-XD, Hardwaxx</div></div><div><button aria-label="Dismiss">×</button><button aria-label="Save">+</button></div></div>
      <div data-testid="player-controls"><div data-testid="general-controls">
        <div class="transport-side"><button aria-label="Shuffle" data-testid="control-button-shuffle" aria-checked="false">⤨</button><button aria-label="Previous">◀</button></div>
        <button aria-label="Pause" data-testid="control-button-playpause"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></span></button>
        <div class="transport-side"><button aria-label="Next">▶</button><button aria-label="Repeat" data-testid="control-button-repeat" aria-checked="true">↻</button></div>
      </div><div class="playback-bar"><span data-testid="playback-position">0:56</span><div data-testid="playback-progressbar"><input type="range" aria-label="Playback" value="45"></div><span data-testid="playback-duration">-0:59</span></div></div>
      <div class="aux-controls"><button aria-label="Lyrics">♩</button><button aria-label="Queue">☰</button><div data-testid="volume-bar"><button aria-label="Mute">◖</button><input type="range" aria-label="Volume" value="65"></div></div>
    </div></footer></aside>
  </div></div>
  <script>
    for (const [index, grid] of [...document.querySelectorAll('[role="grid"]')].entries()) {
      grid.innerHTML = Array.from({length: 6}, (_, i) => `<div role="row"><div role="gridcell"><div role="presentation"><article class="e-10451-card"><div class="e-10451-image__container" style="--hue:${180 + index * 40 + i * 18}"><div class="cover-word">MIX ${i + 1}</div></div><div class="e-10451-card__main"><div class="e-10451-card__column"><div data-encore-id="cardTitle">Daily Mix ${i + 1}</div><div data-encore-id="cardSubtitle"><span class="e-10451-line-clamp">NoiseFlow, FEDX, TOZA, RAYZEN, Dimitri K and more artists</span></div></div></div></article></div></div></div>`).join('');
    }
    const search = document.querySelector('input[type="search"]');
    search.addEventListener('focus', () => { document.querySelector('#search-results').hidden = false; search.setAttribute('aria-expanded', 'true'); });
    search.addEventListener('keydown', event => { if (event.key === 'Escape') document.querySelector('#search-results').hidden = true; });
    window.fixtureCaptionClicks = [];
    document.querySelectorAll('[data-testid="window-controls"] button').forEach(button => button.addEventListener('click', () => window.fixtureCaptionClicks.push(button.ariaLabel)));
    if (new URLSearchParams(location.search).has('native')) {
      document.querySelector('[data-testid="window-controls"]').remove();
      document.querySelector('[aria-label="Main menu"]').remove();
      window.__SpotifyRedesignConfig = { localChannelUrl: 'redesign/channel.json', autoUpdate: false };
    }
    const fixtureTracks = Array.from({length: 40}, (_, index) => ({ uri: 'spotify:track:fixture' + index, uid: 'uid-' + index, name: 'Queue song ' + (index + 1), artists: [{name: 'Fixture artist'}] }));
    window.fixturePlaybackActions = [];
    window.fixtureQueue = { current: null, queued: fixtureTracks.slice(0, 2), nextUp: fixtureTracks.slice(2) };
    window.fixtureHistory = [{ uri: 'spotify:track:past', name: 'Previously played', artists: [{name: 'Past artist'}] }];
    const events = { addListener: () => () => {} };
    window.fixturePlayer = {
      getQueue: () => window.fixtureQueue, getState: () => ({}), getEvents: () => events,
      skipTo: async track => window.fixturePlaybackActions.push(['skip', track]),
      playAsNextInQueue: async tracks => window.fixturePlaybackActions.push(['replay', tracks]),
      reorderQueue: async (tracks, position) => {
        if (window.fixtureRejectMove) throw Error('Move rejected');
        window.fixturePlaybackActions.push(['reorder', tracks, position]);
        const queue = [...window.fixtureQueue.queued, ...window.fixtureQueue.nextUp];
        const moved = queue.find(t => t.uid === tracks[0].uid);
        const remaining = queue.filter(t => t !== moved);
        const target = position.before || position.after;
        const index = remaining.findIndex(t => t.uid === target.uid) + (position.after ? 1 : 0);
        remaining.splice(index, 0, moved);
        window.fixtureQueue = { current: null, queued: remaining.slice(0, 2), nextUp: remaining.slice(2) };
      }
    };
    document.querySelector('#main-view')['__reactFiber$fixture'] = {
      dependencies: {firstContext: {memoizedValue: { resolveNoThrow: token => ({
        PlayerAPI: window.fixturePlayer,
        PlayHistoryAPI: { getContents: async () => ({items: window.fixtureHistory}), getEvents: () => events },
        NativeAPI: new URLSearchParams(location.search).has('native') ? {setWindowButtonsVisibility: async show => { window.fixtureNativeVisible = show; }} : undefined,
      })[token.description] }}}
    };
    if (new URLSearchParams(location.search).has('native')) {
      window.__SpotifyRedesignConfig.desktopWindowControls = true;
      const realFetch = window.fetch.bind(window);
      window.fetch = (input, options = {}) => {
        const url = String(input);
        if (url.includes('desktop-control.json')) return Promise.resolve(Response.json({url:'http://127.0.0.1:65534',token:'a'.repeat(64)}));
        if (url.startsWith('http://127.0.0.1:65534/')) return Promise.resolve(new Response(url.endsWith('/status') ? '{"ready":true}' : '', {status: url.endsWith('/status') ? 200 : 202}));
        return realFetch(input,options);
      };
    }
    const channelUrl = new URL('../../build/site/channel.json', location.href).href;
    fetch(channelUrl).then(response => response.json()).then(channel => {
      window.__SpotifyRedesignBootstrap = { channel, channelUrl, usingFallback: true, autoUpdate: false, updateReady: false };
      const script = document.createElement('script'); script.src = new URL(channel.core.entry, channelUrl); document.body.appendChild(script);
    });
  </script>
</body>
</html>
